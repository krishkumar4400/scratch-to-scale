apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment
  labels:
    name: sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
        - image: sandbox:latest
          imagePullPolicy: IfNotPresent
          name: main-sandbox-container
          resources:
            limits:
              cpu: "500m"
              memory: "400Mi"
            requests:
              cpu: "250m"
              memory: "200Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/sandbox/health
              port: 4000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/sandbox/health
              port: 4000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          ports:
            - containerPort: 4000
              name: main-sandbox
